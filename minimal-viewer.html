<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D BIM Viewer - Minimal Version</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: Arial, sans-serif; 
            background: #1a1a1a; 
            color: white; 
            overflow: hidden;
        }
        #container { width: 100vw; height: 100vh; position: relative; }
        #info {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0,0,0,0.8);
            padding: 15px;
            border-radius: 8px;
            z-index: 100;
            max-width: 300px;
        }
        #upload {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0,0,0,0.8);
            padding: 15px;
            border-radius: 8px;
            z-index: 100;
        }
        #fileInput {
            margin-top: 10px;
            padding: 8px;
            border: 1px solid #444;
            background: #333;
            color: white;
            border-radius: 4px;
        }
        #explodeBtn {
            margin-top: 10px;
            padding: 10px 15px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        #explodeBtn:hover { background: #0056b3; }
        #explodeSlider {
            width: 100%;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div id="container"></div>
    
    <div id="info">
        <h3>🏗️ 3D BIM Viewer</h3>
        <p><strong>Minimal Emergency Version</strong></p>
        <p>📁 Supports: GLB, GLTF files</p>
        <p>🔧 Features: View, Rotate, Explode</p>
        <div id="stats"></div>
        <button id="explodeBtn">💥 Toggle Explode</button>
        <input type="range" id="explodeSlider" min="0" max="2" step="0.1" value="0">
        <div>Explosion: <span id="explodeValue">0%</span></div>
    </div>
    
    <div id="upload">
        <h4>📂 Upload Model</h4>
        <input type="file" id="fileInput" accept=".glb,.gltf">
        <div style="font-size: 12px; margin-top: 5px; color: #ccc;">
            Drag & drop GLB/GLTF files
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/examples/js/controls/OrbitControls.js"></script>

    <script>
        // Basic Three.js setup
        let scene, camera, renderer, controls;
        let currentModel = null;
        let exploded = false;
        let originalPositions = new Map();

        init();
        animate();

        function init() {
            // Scene
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x1a1a1a);

            // Camera
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(5, 5, 5);

            // Renderer
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            document.getElementById('container').appendChild(renderer.domElement);

            // Controls
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;

            // Lighting
            const ambientLight = new THREE.AmbientLight(0x404040, 0.6);
            scene.add(ambientLight);

            const directionalLight = new THREE.DirectionalLight(0xffffff, 1);
            directionalLight.position.set(5, 10, 5);
            directionalLight.castShadow = true;
            scene.add(directionalLight);

            // Grid
            const gridHelper = new THREE.GridHelper(20, 20, 0x444444, 0x444444);
            scene.add(gridHelper);

            // Event listeners
            setupEventListeners();
        }

        function setupEventListeners() {
            // File input
            document.getElementById('fileInput').addEventListener('change', handleFileSelect);
            
            // Drag and drop
            const container = document.getElementById('container');
            container.addEventListener('dragover', (e) => {
                e.preventDefault();
                container.style.background = 'rgba(0, 123, 255, 0.1)';
            });
            
            container.addEventListener('dragleave', (e) => {
                e.preventDefault();
                container.style.background = '';
            });
            
            container.addEventListener('drop', (e) => {
                e.preventDefault();
                container.style.background = '';
                const files = e.dataTransfer.files;
                if (files.length > 0) {
                    loadModel(files[0]);
                }
            });

            // Explode controls
            document.getElementById('explodeBtn').addEventListener('click', toggleExplode);
            document.getElementById('explodeSlider').addEventListener('input', (e) => {
                updateExplode(parseFloat(e.target.value));
            });

            // Resize
            window.addEventListener('resize', onWindowResize);
        }

        function handleFileSelect(event) {
            const file = event.target.files[0];
            if (file) {
                loadModel(file);
            }
        }

        function loadModel(file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                const arrayBuffer = e.target.result;
                
                const loader = new THREE.GLTFLoader();
                loader.parse(arrayBuffer, '', function(gltf) {
                    // Remove previous model
                    if (currentModel) {
                        scene.remove(currentModel);
                    }
                    
                    currentModel = gltf.scene;
                    scene.add(currentModel);
                    
                    // Store original positions
                    storeOriginalPositions(currentModel);
                    
                    // Fit camera to model
                    fitCameraToModel(currentModel);
                    
                    // Update stats
                    updateStats(currentModel);
                    
                }, function(error) {
                    console.error('Error loading model:', error);
                    alert('Error loading model. Please try a different file.');
                });
            };
            reader.readAsArrayBuffer(file);
        }

        function storeOriginalPositions(object) {
            originalPositions.clear();
            object.traverse((child) => {
                if (child.isMesh) {
                    originalPositions.set(child.uuid, child.position.clone());
                }
            });
        }

        function fitCameraToModel(object) {
            const box = new THREE.Box3().setFromObject(object);
            const center = box.getCenter(new THREE.Vector3());
            const size = box.getSize(new THREE.Vector3());
            
            const maxDim = Math.max(size.x, size.y, size.z);
            const distance = maxDim * 2;
            
            camera.position.set(
                center.x + distance,
                center.y + distance,
                center.z + distance
            );
            
            controls.target.copy(center);
            controls.update();
        }

        function updateStats(object) {
            let vertices = 0, faces = 0;
            object.traverse((child) => {
                if (child.isMesh && child.geometry) {
                    vertices += child.geometry.attributes.position.count;
                    if (child.geometry.index) {
                        faces += child.geometry.index.count / 3;
                    }
                }
            });
            
            document.getElementById('stats').innerHTML = `
                <div style="font-size: 12px; margin-top: 10px;">
                    📊 Vertices: ${vertices.toLocaleString()}<br>
                    🔺 Faces: ${Math.round(faces).toLocaleString()}
                </div>
            `;
        }

        function toggleExplode() {
            if (!currentModel) return;
            
            exploded = !exploded;
            if (exploded) {
                updateExplode(1);
                document.getElementById('explodeSlider').value = 1;
            } else {
                updateExplode(0);
                document.getElementById('explodeSlider').value = 0;
            }
        }

        function updateExplode(amount) {
            if (!currentModel) return;
            
            const box = new THREE.Box3().setFromObject(currentModel);
            const center = box.getCenter(new THREE.Vector3());
            
            currentModel.traverse((child) => {
                if (child.isMesh) {
                    const originalPos = originalPositions.get(child.uuid);
                    if (originalPos) {
                        const direction = originalPos.clone().sub(center).normalize();
                        const distance = amount * 3;
                        
                        child.position.copy(originalPos);
                        child.position.add(direction.multiplyScalar(distance));
                    }
                }
            });
            
            document.getElementById('explodeValue').textContent = Math.round(amount * 100) + '%';
            exploded = amount > 0;
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
    </script>

    <div style="position: absolute; bottom: 10px; left: 10px; font-size: 12px; color: #666;">
        💡 This is the minimal emergency version. For full features, extract the complete project.
    </div>
</body>
</html>
